on:
  workflow_dispatch:

name: gams-integration

jobs:
  gams-integration:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Install package
        run: R CMD INSTALL .
      - name: Verify GAMS
        run: Rscript -e 'stopifnot(GAMSr::gams_available())'
      - name: Integration tests
        run: Rscript -e 'testthat::test_local(filter = "gams")'
