on:
  workflow_dispatch:
  pull_request:

name: test-coverage

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
      - name: Test coverage
        run: Rscript -e 'covr::package_coverage()'
